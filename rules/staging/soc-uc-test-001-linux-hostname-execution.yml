schema_version: 1

metadata:
  creation_date: "2025/07/23"
  updated_date:  "2025/07/23"
  maturity: "production"
  author:
    - "HRISHIKESH YALAVARTHI"

rule_id: "5a9cf21e-b521-4979-af11-bb4f4d3acfad"

name: "SOC-UC-TEST-001-Linux-Hostname Execution Detected"

description: |
  Detects execution of the hostname command on Linux systems.
  Attackers commonly run hostname after gaining initial access
  to identify the target machine name and network identity.
  This is a standard post-exploitation reconnaissance technique
  associated with MITRE ATT&CK T1082 (System Information Discovery).

author:
  - "HRISHIKESH YALAVARTHI"

enabled: true
type: esql
language: esql

severity: "low"
risk_score: 21

tags:
  - "Domain: Endpoint"
  - "OS: Linux"
  - "Use Case: Threat Detection"
  - "Tactic: Discovery"
  - "T1082"
  - "Data Source: Elastic Defend"

query: |
  FROM logs-endpoint.events.*
  | WHERE event.action == "exec"
    AND process.name == "hostname"
  | KEEP @timestamp, host.name, user.name,
         process.name, process.command_line,
         event.dataset
  | RENAME event.dataset AS logSource

interval: "5m"
from: "now-10m"
to: "now"

timestamp_override: "event.ingested"
timestamp_override_fallback_disabled: false

threat:
  - framework: "MITRE ATT&CK"
    tactic:
      id: "TA0007"
      name: "Discovery"
      reference: "https://attack.mitre.org/tactics/TA0007/"
    technique:
      - id: "T1082"
        name: "System Information Discovery"
        reference: "https://attack.mitre.org/techniques/T1082/"
        subtechnique: []

note: |
  ## Triage and Analysis

  ### What triggered this alert
  The hostname command was executed on a Linux host indicating
  a process or user queried the machine name and network identity.

  ### Possible investigation steps
  - Examine the parent process of hostname — shell, script, or unknown binary?
  - Check if the same user ran other discovery commands (whoami, id, uname)
  - Review authentication logs for the account around the same timestamp
  - Validate whether the host is expected to have interactive user sessions
  - Hunt for follow-on commands: curl, wget, nc from the same process tree

  ### False positive analysis
  - System administrators checking machine identity during maintenance
  - Automated scripts or monitoring tools collecting host information

  ### Response and remediation
  - Contain: no immediate action for low severity — monitor for follow-on activity
  - Collect: capture process tree, shell history, and auth logs for the session
  - Eradicate: if malicious, terminate session and review for persistence
  - Recover: rotate credentials if account compromise is suspected
  - Escalate if hostname is followed by lateral movement or privilege escalation

  ### References
  - https://attack.mitre.org/techniques/T1082/

false_positives:
  - "System administrators checking machine identity during maintenance"
  - "Automated scripts or monitoring tools collecting host information"

references:
  - "https://attack.mitre.org/techniques/T1082/"

max_signals: 100
actions: []
